name: deploy

# Builds the app on GitHub and ships it to the Hostinger VPS as a new release.
#
# Server layout (under DEPLOY_PATH, default /var/www/qclistore):
#   releases/<commit>   one folder per deploy; the newest 5 are kept
#   shared/.env         production settings, created by hand once
#   shared/storage      uploads, logs, sessions; shared by every release
#   current             symlink to the live release; point Nginx at current/public
#
# Repository secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS (output of `ssh-keyscan <host>`).
# Optional repository variables: SSH_PORT (default 22), DEPLOY_PATH, PHP_FPM_SERVICE (e.g. php8.4-fpm).

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the current one to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment: production

    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH || '/var/www/qclistore' }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      PHP_FPM_SERVICE: ${{ vars.PHP_FPM_SERVICE }}
      RELEASE: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          # Secrets pasted on Windows often carry \r line endings or stray spaces, which break SSH silently.
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          host="$(trim "$SSH_HOST")"
          user="$(trim "$SSH_USER")"

          mkdir -p ~/.ssh
          key="$(printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r')"
          # Browser terminals often lose the key's line breaks on copy, so the key may also be given as one base64 line (`base64 -w0 key`).
          if ! printf '%s' "$key" | grep -q -- '-----BEGIN'; then
            if printf '%s' "$key" | grep -qE '^[[:space:]]*(ssh-|ecdsa-|sk-)'; then
              echo "::error::SSH_PRIVATE_KEY holds a public key (ssh-ed25519 AAAA...). Use the private key file, not the .pub one."
              exit 1
            fi
            if printf '%s' "$key" | grep -q 'PuTTY-User-Key'; then
              echo "::error::SSH_PRIVATE_KEY is a PuTTY .ppk key. Export it in OpenSSH format (PuTTYgen > Conversions > Export OpenSSH key)."
              exit 1
            fi
            if ! key="$(printf '%s' "$key" | tr -d '[:space:]' | base64 -d 2>/dev/null)" || ! printf '%s' "$key" | grep -q -- '-----BEGIN'; then
              echo "::error::SSH_PRIVATE_KEY is neither a private key nor its base64 form. It's ${#SSH_PRIVATE_KEY} characters long; re-copy the output of: base64 -w0 <private key file>"
              exit 1
            fi
          fi
          # Rebuild the PEM layout when the body arrived on one line with spaces instead of newlines.
          header="$(printf '%s' "$key" | grep -o -- '-----BEGIN [A-Z ]*-----' | head -n1)"
          footer="${header/BEGIN/END}"
          body="$(printf '%s' "$key" | tr '\n' ' ' | sed -e "s/.*$header//" -e "s/$footer.*//" | tr -s '[:space:]' '\n' | grep -v '^$')"
          printf '%s\n%s\n%s\n' "$header" "$body" "$footer" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Print the key's fingerprint (not the key) so it can be matched against `ssh-keygen -lf ~/.ssh/authorized_keys` on the VPS.
          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/id_deploy 2>&1 || true)"
          [ "$SSH_PORT" = "22" ] && lookup="$host" || lookup="[$host]:$SSH_PORT"
          # Keep only real host key lines; drop blanks and the "# host:22 SSH-2.0" comments ssh-keyscan prints.
          # A line copied without its leading host ("ssh-ed25519 AAAA...") is pinned to SSH_HOST.
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' | sed -e 's/^[[:space:]]*//' | grep -v -e '^#' -e '^$' \
            | sed -E "s/^((ssh|ecdsa|sk)-[^ ]+ )/$lookup \1/" > ~/.ssh/known_hosts || true
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $host
            User $user
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          EOF

          # Fail with a readable message when SSH_KNOWN_HOSTS doesn't cover SSH_HOST, instead of "Host key verification failed".
          if ! ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::SSH_KNOWN_HOSTS has no entry for SSH_HOST (port $SSH_PORT). Regenerate it with: ssh-keyscan -p $SSH_PORT <SSH_HOST>"
            echo "SSH_KNOWN_HOSTS has $(wc -l < ~/.ssh/known_hosts) key line(s), for these hosts (*** means the same value as SSH_HOST):"
            cut -d' ' -f1 ~/.ssh/known_hosts | sort -u
            exit 1
          fi

      - name: Upload release
        run: |
          # A DEPLOY_PATH pasted with a trailing space, newline or slash would create a second, look-alike folder.
          DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#/*$##')"
          ssh vps "mkdir -p '$DEPLOY_PATH/releases/$RELEASE'"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='/storage' \
            --exclude='/public/storage' \
            ./ "vps:$DEPLOY_PATH/releases/$RELEASE/"

      - name: Activate release
        run: |
          DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#/*$##')"
          ssh vps "DEPLOY_PATH='$DEPLOY_PATH' RELEASE='$RELEASE' PHP_FPM_SERVICE='$PHP_FPM_SERVICE' bash -s" <<'EOF'
          set -euo pipefail

          release="$DEPLOY_PATH/releases/$RELEASE"
          shared="$DEPLOY_PATH/shared"

          if [ ! -f "$shared/.env" ]; then
            echo "Missing $shared/.env; create it on the server before deploying." >&2
            echo "Logged in as $(whoami). Contents of DEPLOY_PATH and DEPLOY_PATH/shared:" >&2
            ls -la "$DEPLOY_PATH" "$shared" >&2 || true
            exit 1
          fi

          # Shared files survive between releases.
          mkdir -p "$shared/storage/app/public" "$shared/storage/framework/cache/data" \
            "$shared/storage/framework/sessions" "$shared/storage/framework/views" "$shared/storage/logs"
          ln -nfs "$shared/.env" "$release/.env"
          ln -nfs "$shared/storage" "$release/storage"

          cd "$release"
          php artisan storage:link --force
          php artisan migrate --force
          php artisan optimize

          # Switch the live site over in one step.
          ln -nfs "$release" "$DEPLOY_PATH/current_tmp"
          mv -Tf "$DEPLOY_PATH/current_tmp" "$DEPLOY_PATH/current"

          # Workers pick up the new code on their next job; PHP-FPM drops its cached copy of the old one.
          php artisan queue:restart
          if [ -n "$PHP_FPM_SERVICE" ]; then
            sudo -n systemctl reload "$PHP_FPM_SERVICE"
          fi

          # Keep the newest 5 releases for rollbacks.
          ls -1dt "$DEPLOY_PATH"/releases/*/ | tail -n +6 | xargs -r rm -rf

          echo "Deployed $RELEASE"
          EOF
